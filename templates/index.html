<!DOCTYPE html>
<html>
<head>
    <title>Healthcare Survey</title>
</head>
<body>

    <h1>Healthcare Spending Survey</h1>

    <form method="POST">

        <label>Age:</label>
        <input type="number" name="age"><br><br>

        <label>Gender:</label>
        <select name="gender">
            <option>Male</option>
            <option>Female</option>
        </select><br><br>

        <label>Total Income:</label>
        <input type="number" name="income"><br><br>

        <h3>Expenses</h3>

        <input type="checkbox" name="utilities">
        Utilities:
        <input type="number" name="utilities_amount"><br><br>

        <input type="checkbox" name="entertainment">
        Entertainment:
        <input type="number" name="entertainment_amount"><br><br>

        <input type="checkbox" name="school">
        School Fees:
        <input type="number" name="school_amount"><br><br>

        <input type="checkbox" name="shopping">
        Shopping:
        <input type="number" name="shopping_amount"><br><br>

        <input type="checkbox" name="healthcare">
        Healthcare:
        <input type="number" name="healthcare_amount"><br><br>

        <button type="submit">Submit</button>

    </form>

</body>
</html>
